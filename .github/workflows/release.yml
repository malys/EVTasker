name: Release

# Tag push only — publishing an APK that automates a car is a human decision.
#
# La signature utilise la MÊME clé plateforme que EVProfile, et ce n'est pas un détail
# d'organisation : la permission signature qui protège le pont n'est accordée que si les
# deux APK partagent la clé. Un EVTasker signé autrement s'installe et ne fait rien.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      EV_KEYSTORE_BASE64: ${{ secrets.EV_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode platform keystore
        if: ${{ env.EV_KEYSTORE_BASE64 != '' }}
        run: |
          # Tolerate newlines/spaces in the secret; printf avoids a stray trailing newline.
          printf '%s' "$EV_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/platform.keystore"
          # A PKCS12/JKS keystore starts with 0x30 (DER SEQUENCE); anything else is corrupt.
          if [ "$(head -c1 "$RUNNER_TEMP/platform.keystore" | od -An -tx1 | tr -d ' ')" != "30" ]; then
            echo "::error::EV_KEYSTORE_BASE64 is invalid. Recreate the secret with: base64 -w0 platform.keystore"
            exit 1
          fi
          echo "EV_KEYSTORE=$RUNNER_TEMP/platform.keystore" >> "$GITHUB_ENV"

      - name: Run checks before publishing
        run: |
          chmod +x gradlew
          bash .github/security/check-permissions.sh
          ./gradlew testStableDebugUnitTest lintStableDebug --no-daemon

      - name: Build release APK
        env:
          EV_KEYSTORE_PASSWORD: ${{ secrets.EV_KEYSTORE_PASSWORD }}
          EV_KEY_ALIAS: ${{ secrets.EV_KEY_ALIAS }}
          EV_KEY_PASSWORD: ${{ secrets.EV_KEY_PASSWORD }}
        run: ./gradlew assembleStableRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          # AGP 9 emits app-release.apk; rename to the published convention.
          ver=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          find app/build/outputs/apk -name "app-stable-release.apk" -exec cp {} "dist/EVTasker-stable-${ver}.apk" \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: evtasker-apk
          path: dist/*.apk

      - name: Extract changelog
        id: changelog
        run: |
          {
            echo 'notes<<CHANGELOG_EOF'
            ./release-notes.sh "${{ github.ref_name }}" || ./release-notes.sh --latest
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          files: dist/*.apk
          body: |
            ## EVTasker ${{ github.ref_name }}

            Manual installation. This application embeds **no auto-updater** and contacts
            no server.

            ### Requirements
            - The APK must be signed with the vehicle ROM's platform key so Android grants
              the signature-level vehicle permissions.
            - **EVProfile is optional** and is used only by the "apply saved profile" action.
            - R8 is enabled on this build. **Verify on the vehicle** before relying on it:
              vendor services and vehicle writes cannot be proven by an emulator.

            ### Install
            Copy the APK to a USB stick, open the car's Files app and tap it.

            ### Changelog
            ${{ steps.changelog.outputs.notes }}
