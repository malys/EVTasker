name: Release

# Tag push only — publishing an APK that automates a car is a human decision.
#
# La signature utilise la MÊME clé plateforme que MG4Control, et ce n'est pas un détail
# d'organisation : la permission signature qui protège le pont n'est accordée que si les
# deux APK partagent la clé. Un MG4Tasker signé autrement s'installe et ne fait rien.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish APK
    runs-on: ubuntu-latest
    env:
      MG4_KEYSTORE_BASE64: ${{ secrets.MG4_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode platform keystore
        if: ${{ env.MG4_KEYSTORE_BASE64 != '' }}
        run: |
          # Tolerate newlines/spaces in the secret; printf avoids a stray trailing newline.
          printf '%s' "$MG4_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/platform.keystore"
          # A PKCS12/JKS keystore starts with 0x30 (DER SEQUENCE); anything else is corrupt.
          if [ "$(head -c1 "$RUNNER_TEMP/platform.keystore" | od -An -tx1 | tr -d ' ')" != "30" ]; then
            echo "::error::MG4_KEYSTORE_BASE64 is invalid. Recreate the secret with: base64 -w0 platform.keystore"
            exit 1
          fi
          echo "MG4_KEYSTORE=$RUNNER_TEMP/platform.keystore" >> "$GITHUB_ENV"

      - name: Run checks before publishing
        run: |
          chmod +x gradlew
          bash .github/security/check-permissions.sh
          ./gradlew testStableDebugUnitTest lintStableDebug --no-daemon

      - name: Build release APK
        env:
          MG4_KEYSTORE_PASSWORD: ${{ secrets.MG4_KEYSTORE_PASSWORD }}
          MG4_KEY_ALIAS: ${{ secrets.MG4_KEY_ALIAS }}
          MG4_KEY_PASSWORD: ${{ secrets.MG4_KEY_PASSWORD }}
        run: ./gradlew assembleStableRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          # AGP 9 emits app-release.apk; rename to the published convention.
          ver=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)"/\1/')
          find app/build/outputs/apk -name "app-stable-release.apk" -exec cp {} "dist/MG4Tasker-stable-${ver}.apk" \;
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: mg4tasker-apk
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          files: dist/*.apk
          body: |
            ## MG4Tasker ${{ github.ref_name }}

            Installation manuelle. Cette application n'embarque **aucun auto-updater** et
            ne contacte aucun serveur.

            ### Prérequis
            - **MG4Control installé**, signé avec la même clé plateforme. Sans lui,
              MG4Tasker démarre mais n'a accès à rien : l'onglet Diagnostic affichera
              « Pont MG4Control : injoignable ».
            - R8 est activé sur cette build. **Vérifiez sur véhicule** avant de vous y
              fier : le code du pont est résolu par nom au moment de la liaison.

            ### Installation
            Copiez l'APK sur une clé USB, ouvrez l'application Fichiers de la voiture
            et appuyez dessus.
