name: 🔐 Security Vulnerability
description: Report a security vulnerability (confidential)
title: "[SECURITY] "
labels: [security, confidential]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        # Security Vulnerability Report

        **⚠️ CONFIDENTIAL:** Do not disclose vulnerability details publicly.

        Please report security issues via private GitHub Security Advisory instead:
        1. Click "Report a vulnerability" at `/security/advisories/new`
        2. Or email: [maintainer security contact]
        3. Do **not** post details in public issues

        This template is for urgent in-scope vulnerabilities only.

  - type: checkboxes
    id: checks
    attributes:
      label: "Security Classification"
      description: "Select the vulnerability type"
      options:
        - label: "Prompt injection / malicious rule input not validated"
        - label: "Task injection (unintended task execution from untrusted input)"
        - label: "Rule sequencing bypass (atomicity violation)"
        - label: "State corruption (rule state becomes inconsistent)"
        - label: "Condition bypass (gate condition ignored)"
        - label: "Unauthorized vehicle action (unintended profile/setting change)"
        - label: "MG4Control bridge exploitation (improper IPC validation)"
        - label: "Data exfiltration (personal data leaked via rule log/export)"
        - label: "Privilege escalation or permission abuse"
        - label: "Code execution vulnerability"
        - label: "Other security issue affecting task execution"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: "Vulnerability Title"
      description: "Concise title (do not include exploit details)"
      placeholder: "Malicious rule name injection causes unintended task execution"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Vulnerability Description"
      description: |
        High-level description (no exploit steps or proof-of-concept):
        - What is vulnerable
        - Why it matters
        - Impact on automation and vehicle
      placeholder: |
        Rule names are not sanitized; attacker can inject task commands via rule name.
        Example: rule name "Set Profile; Execute Unintended Action" parsed as two tasks.
        Impact: Attacker gains ability to execute arbitrary automation sequences, including vehicle actions.
      rows: 6
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Severity (CVSS)"
      description: "CVSS v3.1 rating"
      options:
        - "Critical (9.0–10.0) — Arbitrary task execution / vehicle control"
        - "High (7.0–8.9) — Rule state corruption / sequencing bypass"
        - "Medium (4.0–6.9) — Unauthorized action under specific conditions"
        - "Low (0.1–3.9) — Minor issue affecting specific workflows"
    validations:
      required: true

  - type: input
    id: affected
    attributes:
      label: "Affected Versions"
      description: "Which versions are affected?"
      placeholder: "MG4Tasker < 1.0.0 (all builds)"
    validations:
      required: true

  - type: textarea
    id: remediation
    attributes:
      label: "Suggested Remediation"
      description: "How should this be fixed?"
      placeholder: |
        1. Sanitize all rule input (name, trigger values, condition values)
        2. Parse rule schema strictly (no dynamic code execution)
        3. Validate rule sequencing before execution (no injection)
        4. Add unit tests for malicious input handling
      rows: 5

  - type: checkboxes
    id: consent
    attributes:
      label: "Consent"
      options:
        - label: I understand this vulnerability will be handled according to the security policy
          required: true
        - label: I consent to coordinated disclosure and a reasonable embargo period
          required: true
