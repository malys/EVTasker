name: Feature request
description: Suggest a condition, action, or behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation in the car, not the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like it to do
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Please confirm
      options:
        - label: If this writes to the vehicle, MG4Control must expose it — a verified read comes before any write.
          required: true
        - label: I have considered that automated writes happen with no one looking at the screen.
          required: true
